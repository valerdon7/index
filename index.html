<style>
/* Layout: one centred card on a white field scattered with pink & gold dogs; Nein flees across the whole screen */
:root{
  --bg:#fffdfd;
  --ink:#4a2b36;
  --muted:#9a7884;
  --pink:#f06a9b;
  --pink-soft:#ffe3ee;
  --pink-deep:#d94a7f;
  --gold:#c9a24a;
  --gold-soft:#f6e7bf;
  --card:#ffffff;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* background critters */
#critters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.critter{position:absolute;animation:bob 6s ease-in-out infinite}
.critter svg{display:block;width:100%;height:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-8px) rotate(calc(var(--r) + 4deg))}}

.stage{position:relative;z-index:1;height:100%;display:flex;padding:16px;overflow-y:auto}
.stage > .card{margin:auto}
.card{
  width:min(100%,420px);background:var(--card);border-radius:28px;
  padding:34px 24px 30px;text-align:center;
  border:1.5px solid var(--gold-soft);
  box-shadow:0 18px 50px -18px rgba(217,74,127,.35),0 0 0 8px rgba(255,227,238,.55);
  display:flex;flex-direction:column;align-items:center;gap:14px
}
.photo-wrap{position:relative;width:150px;height:150px;flex:none;margin-bottom:4px}
.photo-ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,#f6e7bf,#c9a24a,#fff4d6,#f06a9b,#f6e7bf,#c9a24a,#fff4d6,#f9c4d7,#f6e7bf);animation:spin 6s linear infinite;box-shadow:0 0 22px rgba(201,162,74,.55),0 0 40px rgba(240,106,155,.3)}
.photo{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:55% 40%;border:4px solid #fff;display:block}
.photo-dog{position:absolute;width:62px;bottom:-6px;right:-30px;color:#f6a6c3;transform:rotate(-6deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{position:absolute;pointer-events:none;color:var(--gold);animation:twinkle 1.8s ease-in-out infinite}
.spark svg{display:block;width:100%;height:100%}
@keyframes twinkle{0%,100%{transform:scale(.2) rotate(0deg);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
#sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glint{position:fixed;pointer-events:none;z-index:40;animation:glint .9s ease-out forwards}
.glint svg{display:block;width:100%;height:100%}
@keyframes glint{0%{transform:translate(0,0) scale(1) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) scale(0) rotate(180deg);opacity:0}}
#yes{position:relative;overflow:hidden}
#yes::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.card{position:relative}
.card .spark{z-index:2}
h1 em{background:linear-gradient(90deg,#d94a7f,#f06a9b,#c9a24a,#f06a9b,#d94a7f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gleam 4s linear infinite;padding-right:.08em}
@keyframes gleam{to{background-position:-200% 0}}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:700;font-size:clamp(1.9rem,8vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
h1 em{color:var(--pink);font-style:italic}
.sub{margin:0;color:var(--muted);font-size:.98rem}
.buttons{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:10px;min-height:64px;flex-wrap:wrap}
button{font-family:var(--body);font-weight:800;font-size:1.1rem;border:0;cursor:pointer;border-radius:999px;padding:14px 34px;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#yes{background:linear-gradient(180deg,#f57fa9,var(--pink-deep));color:#fff;box-shadow:0 8px 20px -6px rgba(217,74,127,.6),inset 0 -2px 0 rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#yes:active{filter:brightness(.95)}
#no{background:#fff;color:var(--muted);border:2px solid var(--pink-soft);transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1);z-index:5;white-space:nowrap}
#no.flee{position:fixed;margin:0}
.hint{font-size:.82rem;color:var(--muted);min-height:1.2em;margin:0}

/* modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(255,240,246,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;padding:16px;overflow-y:auto;animation:fade .3s ease}
.overlay > .sheet{margin:auto}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,420px);background:#fff;border-radius:28px;padding:28px 20px 24px;text-align:center;border:1.5px solid var(--gold-soft);box-shadow:0 24px 60px -20px rgba(217,74,127,.45);animation:pop .45s cubic-bezier(.3,1.5,.5,1);display:flex;flex-direction:column;gap:14px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:700;font-size:1.6rem;margin:0;line-height:1.15;text-wrap:balance}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--pink-soft);color:var(--ink);border-radius:20px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1rem;border:2px solid transparent;transition:transform .15s,border-color .15s}
.opt .ico{font-size:2.3rem;line-height:1}
.opt:hover,.opt:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.opt:active{transform:scale(.96)}
.other-row{display:flex;gap:8px}
.other-row input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:14px;border:2px solid var(--pink-soft);color:var(--ink);background:#fff}
.other-row input:focus{outline:none;border-color:var(--gold)}
.other-row button{padding:12px 18px;font-size:1rem;background:var(--pink-deep);color:#fff;border-radius:14px}

/* polaroid */
.polaroid{position:relative;margin:4px auto 6px;width:min(78%,250px);background:#fff;padding:10px 10px 6px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 10px 26px -10px rgba(74,43,54,.4),0 0 0 2px var(--gold-soft);animation:pol-in .7s cubic-bezier(.3,1.5,.5,1)}
.polaroid img{display:block;width:100%;aspect-ratio:440/373;object-fit:cover;border-radius:3px}
.polaroid figcaption{font-family:var(--display);font-style:italic;font-weight:600;color:var(--pink-deep);font-size:1.1rem;padding-top:6px}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:80px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(249,196,215,.75);border-radius:3px}
.pol-heart{position:absolute;width:38px;right:-14px;bottom:18px;color:var(--pink);transform:rotate(14deg);filter:drop-shadow(0 3px 6px rgba(217,74,127,.4));animation:beat 1.2s ease-in-out infinite}
.pol-star{position:absolute;color:var(--gold);animation:twinkle 1.8s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(246,195,90,.9))}
.pol-star.s1{width:22px;left:-14px;top:24px}
.pol-star.s2{width:16px;right:-8px;top:-8px;animation-delay:-.9s}
@keyframes pol-in{from{transform:rotate(-14deg) scale(.6);opacity:0}}
@keyframes beat{0%,100%{transform:rotate(14deg) scale(1)}50%{transform:rotate(14deg) scale(1.15)}}

/* voucher */
.voucher{position:relative;background:linear-gradient(135deg,#fff 0%,#fff6f9 100%);border:2px dashed var(--gold);border-radius:22px;padding:22px 18px 20px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.voucher::before,.voucher::after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;border:2px dashed var(--gold);transform:translateY(-50%)}
.voucher::before{left:-15px}.voucher::after{right:-15px}
.v-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800}
.v-big{font-size:3rem;line-height:1}
.v-text{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:1.35rem;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.v-text strong{color:var(--pink-deep);font-style:italic}
.v-meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--gold-soft);padding-top:10px;margin-top:4px}
.v-meta b{display:block;color:var(--ink);font-size:.86rem}
.again{background:none;color:var(--muted);font-size:.9rem;font-weight:700;padding:6px;text-decoration:underline;text-underline-offset:3px}

.heart{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .critter,.heart,.spark,.photo-ring,#yes::after,h1 em{animation:none}
  .spark{opacity:.8;transform:none}
  #no{transition:none}
}
</style>

      <figcaption>wir zwei</figcaption>
      <svg class="pol-heart" viewBox="0 0 40 36" aria-hidden="true"><use href="#herz"/></svg>
      <svg class="pol-star s1" viewBox="0 0 40 40" aria-hidden="true"><use href="#stern"/></svg>
      <svg class="pol-star s2" viewBox="0 0 40 40" aria-hidden="true"><use href="#stern"/></svg>
    </figure>
    <div class="voucher">
      <span class="v-label">Gutschein</span>
      <span class="v-big" id="vIcon">🍣</span>
      <p class="v-text" id="vText">Du hast einen kostenlosen Essen-geh-Gutschein für <strong>Sushi</strong></p>
      <div class="v-meta">
        <span>Einlösbar bei<b>mir</b></span>
        <span>Gültig<b>ab sofort</b></span>
        <span>Wert<b>unbezahlbar</b></span>
      </div>
    </div>
    <p class="sub">Mach am besten einen Screenshot davon.</p>
    <button class="again" id="again" type="button">Doch was anderes wählen</button>
  </div>
</div>

<script>
(function(){
  /* ---------- background critters ---------- */
  const layer = document.getElementById('critters');
  const VB = {dackel:'0 0 120 60',welpe:'0 0 60 60',pfote:'0 0 40 40',knochen:'0 0 60 26',herz:'0 0 40 36',
    katze:'0 0 60 60',hase:'0 0 60 70',baer:'0 0 60 60',kueken:'0 0 60 56',fuchs:'0 0 60 60',schmetterling:'0 0 60 50',stern:'0 0 40 40'};
  const kinds = [
    {id:'dackel',w:[70,105],weight:4},
    {id:'welpe',w:[34,50],weight:2},
    {id:'katze',w:[34,50],weight:3},
    {id:'hase',w:[30,44],weight:3},
    {id:'baer',w:[34,48],weight:2},
    {id:'kueken',w:[30,42],weight:2},
    {id:'fuchs',w:[34,46],weight:2},
    {id:'schmetterling',w:[28,40],weight:2},
    {id:'pfote',w:[18,26],weight:1},
    {id:'knochen',w:[28,40],weight:1},
    {id:'herz',w:[16,24],weight:2}
  ];
  const colors = ['#f6a6c3','#f9c4d7','#e8c97a','#f3d99a','#f58db3'];
  const pool = kinds.flatMap(k => Array(k.weight).fill(k));
  function placeCritters(){
    layer.innerHTML = '';
    const W = innerWidth, H = innerHeight;
    const cols = Math.max(4, Math.round(W/95)), rows = Math.max(6, Math.round(H/95));
    const cw = W/cols, ch = H/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(Math.random()<.25) continue;
      const k = pool[Math.floor(Math.random()*pool.length)];
      const w = k.w[0] + Math.random()*(k.w[1]-k.w[0]);
      const el = document.createElement('div');
      el.className = 'critter';
      el.style.width = w+'px';
      el.style.left = (c*cw + Math.random()*Math.max(0,cw-w)) + 'px';
      el.style.top = (r*ch + Math.random()*Math.max(0,ch-w*.6)) + 'px';
      el.style.color = colors[Math.floor(Math.random()*colors.length)];
      el.style.opacity = (.35 + Math.random()*.35).toFixed(2);
      el.style.setProperty('--r', (Math.random()*30-15).toFixed(1)+'deg');
      el.style.animationDelay = (-Math.random()*6).toFixed(2)+'s';
      el.style.animationDuration = (5+Math.random()*3).toFixed(2)+'s';
      const flip = Math.random()<.5 ? ' style="transform:scaleX(-1)"' : '';
      el.innerHTML = `<svg viewBox="${VB[k.id]}"${flip}><use href="#${k.id}"/></svg>`;
      layer.appendChild(el);
    }
  }
  placeCritters();

  /* ---------- constant twinkling ---------- */
  const sparkLayer = document.getElementById('sparkles');
  const sparkColors = ['#c9a24a','#e8c97a','#f06a9b','#f6c35a','#f58db3'];
  function makeSpark(parent, x, y, size, delay, dur, unit){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x + unit; s.style.top = y + unit;
    s.style.width = s.style.height = size + 'px';
    s.style.color = sparkColors[Math.floor(Math.random()*sparkColors.length)];
    s.style.animationDelay = delay + 's';
    s.style.animationDuration = dur + 's';
    s.style.filter = 'drop-shadow(0 0 4px rgba(246,195,90,.8))';
    s.innerHTML = '<svg viewBox="0 0 40 40"><use href="#stern"/></svg>';
    parent.appendChild(s);
  }
  function placeSparkles(){
    sparkLayer.innerHTML = '';
    const n = Math.round(innerWidth*innerHeight/9000);
    for(let i=0;i<n;i++) makeSpark(sparkLayer, Math.random()*100, Math.random()*100, 6+Math.random()*14, -Math.random()*3, 1.4+Math.random()*2, '%');
  }
  placeSparkles();
  /* sparkles around the photo and the card */
  const pw = document.getElementById('photoWrap');
  for(let i=0;i<9;i++){
    const a = Math.random()*Math.PI*2, rad = 82 + Math.random()*16;
    makeSpark(pw, 75 + Math.cos(a)*rad - 8, 75 + Math.sin(a)*rad - 8, 10+Math.random()*10, -Math.random()*2, 1.2+Math.random()*1.4, 'px');
  }
  const card = document.getElementById('ask');
  [[4,6],[92,4],[2,62],[94,48],[88,90],[8,94]].forEach(([x,y]) => makeSpark(card, x, y, 14+Math.random()*8, -Math.random()*2, 1.6+Math.random(), '%'));

  /* glitter burst wherever she taps */
  function burst(x, y, n){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for(let i=0;i<n;i++){
      const g = document.createElement('div');
      g.className = 'glint';
      const sz = 6 + Math.random()*10, a = Math.random()*Math.PI*2, d = 30 + Math.random()*60;
      g.style.left = (x - sz/2) + 'px'; g.style.top = (y - sz/2) + 'px';
      g.style.width = g.style.height = sz + 'px';
      g.style.color = sparkColors[i % sparkColors.length];
      g.style.setProperty('--dx', Math.cos(a)*d + 'px');
      g.style.setProperty('--dy', Math.sin(a)*d + 'px');
      g.innerHTML = '<svg viewBox="0 0 40 40"><use href="#stern"/></svg>';
      document.body.appendChild(g);
      setTimeout(() => g.remove(), 1000);
    }
  }
  addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 10));
  let lastTrail = 0;
  addEventListener('pointermove', e => {
    const now = Date.now(); if(now - lastTrail < 60) return; lastTrail = now;
    burst(e.clientX, e.clientY, 2);
  });

  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{placeCritters();placeSparkles()},200)});

  /* ---------- the runaway Nein ---------- */
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const hint = document.getElementById('hint');
  const lines = ['Nein','Sicher?','Ganz sicher?','Nö, geht nicht','Versuch’s weiter','Zu langsam!','Haha','Fast!','Der Dackel sagt Ja','Gib auf :)'];
  const hints = ['','Hm, der Button ist schüchtern.','Er mag dich wohl nicht loslassen.','Der Ja-Button wird immer größer …','Tipp: Ja geht viel leichter.'];
  let tries = 0;

  function flee(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    tries++;
    const r = no.getBoundingClientRect();
    if(!no.classList.contains('flee')){
      no.style.left = r.left+'px'; no.style.top = r.top+'px';
      no.classList.add('flee');
      no.getBoundingClientRect();
    }
    no.textContent = lines[tries % lines.length];
    const bw = no.offsetWidth, bh = no.offsetHeight, m = 16;
    const yr = yes.getBoundingClientRect();
    let x, y, guard = 0;
    do{
      x = m + Math.random()*Math.max(1, innerWidth - bw - 2*m);
      y = m + Math.random()*Math.max(1, innerHeight - bh - 2*m);
      guard++;
    } while(guard < 40 && (
      Math.hypot(x - r.left, y - r.top) < 140 ||
      (x < yr.right+10 && x+bw > yr.left-10 && y < yr.bottom+10 && y+bh > yr.top-10)
    ));
    no.style.left = x+'px'; no.style.top = y+'px';
    yes.style.transform = `scale(${Math.min(1.7, 1 + tries*0.07)})`;
    hint.textContent = hints[Math.min(hints.length-1, Math.floor(tries/2))];
  }
  no.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') flee(e); });
  no.addEventListener('touchstart', flee, {passive:false});
  no.addEventListener('pointerdown', flee);
  no.addEventListener('click', flee);
  no.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' ') flee(e); });
  /* desktop: also run when the cursor gets close */
  addEventListener('mousemove', e => {
    if(!no.offsetParent && !no.classList.contains('flee')) return;
    const r = no.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(Math.abs(e.clientX-cx) < r.width/2 + 30 && Math.abs(e.clientY-cy) < r.height/2 + 30) flee();
  });

  /* ---------- Ja → pick food ---------- */
  const pick = document.getElementById('pick');
  const result = document.getElementById('result');
  const otherForm = document.getElementById('otherForm');
  const otherInput = document.getElementById('otherInput');

  yes.addEventListener('click', () => {
    no.hidden = true;
    pick.hidden = false;
    hearts(36);
  });

  const icons = {Sushi:'🍣', Pizza:'🍕', Burger:'🍔'};
  pick.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.food;
    if(f === 'other'){ otherForm.hidden = false; otherInput.focus(); return; }
    showVoucher(f, icons[f]);
  }));
  otherForm.addEventListener('submit', e => {
    e.preventDefault();
    const v = otherInput.value.trim();
    if(!v){ otherInput.focus(); otherInput.placeholder = 'Schreib kurz, worauf du Lust hast'; return; }
    showVoucher(v, '✨');
  });

  function showVoucher(food, icon){
    document.getElementById('vIcon').textContent = icon;
    const t = document.getElementById('vText');
    t.textContent = 'Du hast einen kostenlosen Essen-geh-Gutschein für ';
    const s = document.createElement('strong'); s.textContent = food; t.appendChild(s);
    pick.hidden = true; result.hidden = false;
    hearts(60);
  }
  document.getElementById('again').addEventListener('click', () => {
    result.hidden = true; pick.hidden = false;
    otherForm.hidden = true; otherInput.value = '';
  });

  /* ---------- falling hearts ---------- */
  function hearts(n){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cs = ['#f06a9b','#f6a6c3','#c9a24a','#e8c97a','#d94a7f'];
    for(let i=0;i<n;i++){
      const h = document.createElement('div');
      h.className = 'heart';
      const s = 12 + Math.random()*16;
      h.style.left = Math.random()*100+'vw';
      h.style.width = s+'px';
      h.style.color = cs[i % cs.length];
      h.style.animationDuration = (2.4 + Math.random()*2.2)+'s';
      h.style.animationDelay = (Math.random()*0.8)+'s';
      h.innerHTML = '<svg viewBox="0 0 40 36"><use href="#herz"/></svg>';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5500);
    }
  }
})();
</script>
